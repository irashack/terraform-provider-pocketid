name: Maintenance CI
on:
  push:
    branches: [main-maintenance]
  pull_request:
    branches: [main-maintenance]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make check
      - run: make actionlint
      - run: make vuln
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - pocketid: '2.9.0'
            target: test-acc
          - pocketid: '2.13.0'
            target: test-acc
          - pocketid: '2.14.0'
            target: test-acc-provider
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Disposable credentials only; never upload acceptance output or state.
      # The broader 2.14 suite includes clients; see TESTING.md for exclusions.
      - run: make "$TEST_TARGET" POCKETID_VERSION="$POCKETID_VERSION"
        env:
          TEST_TARGET: ${{ matrix.target }}
          POCKETID_VERSION: ${{ matrix.pocketid }}
