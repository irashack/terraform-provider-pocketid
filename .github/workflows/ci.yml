name: Maintenance CI
on:
  push:
    branches: [main-maintenance]
  pull_request:
    branches: [main-maintenance]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
      - run: go test -race ./internal/...
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee
        with:
          version: v2.13.2
  clients:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pocketid: ['2.9.0', '2.13.0', '2.14.0']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
      - run: python3 scripts/disposable-pocketid.py ${{ matrix.pocketid }} -- go test -v -count=1 -timeout 15m ./internal/provider -tags=acc -run '^TestAccResourceClient'
