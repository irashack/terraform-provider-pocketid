# Optional: pre-commit install. CI uses these same Make targets.
repos:
  - repo: local
    hooks:
      - id: go-format
        name: Go format check
        entry: make fmt-check
        language: system
        pass_filenames: false
        types: [go]
      - id: go-vet
        name: Go vet
        entry: make vet
        language: system
        pass_filenames: false
        types: [go]
