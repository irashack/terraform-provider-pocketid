# .goreleaser.yml
# Configuration for GoReleaser
# Documentation: https://goreleaser.com

version: 2

# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# Git configuration
git:
  # Ignore dev pre-release tags when resolving the previous/current tag.
  # The cleanup-on-tag-push workflow deletes these tags during a release, so
  # using one as the changelog base produces a 404 against the GitHub compare
  # API. Ignoring them makes the previous tag resolve to the last stable release.
  ignore_tags:
    - "*-dev*"

# Build configuration
builds:
  - id: terraform-provider-pocketid
    binary: "{{ .ProjectName }}_v{{ .Version }}"
    env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}"
    goos:
      - darwin
      - linux
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
      - arm
      - 386
    goarm:
      - "6"
      - "7"
    ignore:
      # Windows doesn't support ARM
      - goos: windows
        goarch: arm64
      - goos: windows
        goarch: arm
      # Darwin doesn't support 386 or ARMv6/v7
      - goos: darwin
        goarch: 386
      - goos: darwin
        goarch: arm
      # FreeBSD only supports amd64 and 386
      - goos: freebsd
        goarch: arm64
      - goos: freebsd
        goarch: arm

# Archive configuration
archives:
  - id: terraform-provider-pocketid
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    formats:
      - zip
    files:
      - LICENSE
      - README.md
      - docs/**/*

# Checksum configuration
checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"

# Release configuration
release:
  github:
    owner: irashack
    name: terraform-provider-pocketid

  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"

  # Release notes
  header: |
    Maintenance fork of Trozz/terraform-provider-pocketid, based on upstream v2.3.0.
    Fixes confidential OIDC client creation on Pocket ID 2.14 and hardens failure handling.
    See README.md, INSTALL.md, TESTING.md and CHANGELOG.md in this release's source.
    Registry publication is pending. Use the fork identity and native filesystem mirror.
    Archives and SHA256SUMS are published without a registry signing key.

  # Prerelease configuration
  prerelease: auto

  # Draft release (set to false for automatic publishing)
  draft: false

  # Name template for the release
  name_template: "v{{ .Version }}"

  # Disable the automatic truncation of the release notes
  disable: false

# Changelog configuration
changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^build:"
      - "^ci:"
      - "typo"
      - "Merge pull request"
      - "Merge branch"

  groups:
    - title: "🚀 Features"
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 100
    - title: "🐛 Bug Fixes"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 200
    - title: "🔨 Enhancements"
      regexp: "^.*enhance[(\\w)]*:+.*$"
      order: 300
    - title: "📚 Documentation"
      regexp: "^.*docs[(\\w)]*:+.*$"
      order: 400
    - title: "🔧 Maintenance"
      order: 999

# Announce releases
announce:
  skip: false
  discord:
    enabled: false

  slack:
    enabled: false

  twitter:
    enabled: false

# Snapshot configuration (for development builds)
snapshot:
  version_template: "{{ incpatch .Version }}-dev-{{ .ShortCommit }}"
