# .goreleaser.yml
# Configuration for GoReleaser
# Documentation: https://goreleaser.com

version: 2

# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# Git configuration
git:
  # Ignore dev pre-release tags when resolving the previous/current tag.
  # Historical upstream dev tags are not stable changelog bases.
  ignore_tags:
    - "*-dev*"

# Build configuration
builds:
  - id: terraform-provider-pocketid
    binary: "{{ .ProjectName }}_v{{ .Version }}"
    env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}"
    goos:
      - darwin
      - linux
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
      - arm
      - 386
    # One linux/arm build, GOARM 6, published as linux_arm: the registries
    # accept only Terraform's platform names (3.1.2's linux_armv6 and
    # linux_armv7 archives made the Terraform Registry refuse the release).
    goarm:
      - "6"
    ignore:
      # Windows doesn't support ARM
      - goos: windows
        goarch: arm64
      - goos: windows
        goarch: arm
      # Darwin doesn't support 386 or ARMv6/v7
      - goos: darwin
        goarch: 386
      - goos: darwin
        goarch: arm
      # FreeBSD only supports amd64 and 386
      - goos: freebsd
        goarch: arm64
      - goos: freebsd
        goarch: arm

# Archive configuration
archives:
  - id: terraform-provider-pocketid
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - zip
    files:
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - README.md
      - docs/**/*
      - INSTALL.md
      - TESTING.md
      - CHANGELOG.md

# Checksum configuration
checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"

# Signing: a detached binary signature of the SHA256SUMS file, which both
# registries verify. The key is release-signing-key.asc; its private half is the
# release workflow's GPG_PRIVATE_KEY secret, and GPG_FINGERPRINT selects it.
signs:
  - id: checksums
    artifacts: checksum
    cmd: gpg
    signature: "${artifact}.sig"
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

# Release configuration
release:
  github:
    owner: irashack
    name: terraform-provider-pocketid

  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"

  # Release notes
  header: |
    Independent Terraform/OpenTofu provider for Pocket ID. It began as a fork of
    Trozz/terraform-provider-pocketid by Michael Leer (MIT; the notice stays in
    LICENSE and THIRD_PARTY_NOTICES.md) and is maintained on its own since 3.0.0.
    Supported Pocket ID versions: 2.14.0 through 2.18.0.
    See README.md, INSTALL.md, UPSTREAM.md, TESTING.md and CHANGELOG.md in this release's source.
    Listed on the Terraform Registry as irashack/pocketid (the OpenTofu registry listing is pending); the native filesystem mirror remains an alternative.
    SHA256SUMS is signed: SHA256SUMS.sig is a detached signature by the key in release-signing-key.asc, fingerprint FE9D 704B 2C1E 6675 46F0 EBB1 E031 C4DE 04D8 19D6.

  # Prerelease configuration
  prerelease: auto

  # Review checksums and native lifecycle evidence before publishing the draft.
  draft: true

  # Name template for the release
  name_template: "v{{ .Version }}"

  # Disable the automatic truncation of the release notes
  disable: false

# Changelog configuration
changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^build:"
      - "^ci:"
      - "typo"
      - "Merge pull request"
      - "Merge branch"

  groups:
    - title: "🚀 Features"
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 100
    - title: "🐛 Bug Fixes"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 200
    - title: "🔨 Enhancements"
      regexp: "^.*enhance[(\\w)]*:+.*$"
      order: 300
    - title: "📚 Documentation"
      regexp: "^.*docs[(\\w)]*:+.*$"
      order: 400
    - title: "🔧 Maintenance"
      order: 999

# Announce releases
announce:
  skip: false
  discord:
    enabled: false

  slack:
    enabled: false

  twitter:
    enabled: false

# Snapshot configuration (for development builds)
snapshot:
  version_template: "{{ incpatch .Version }}-dev-{{ .ShortCommit }}"
